[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-pen-snmp-agent"
version = "0.1.0"
description = "Async SNMP agent that maps selected device data into a private enterprise subtree."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "pysnmp>=7.1,<8",
    "PyYAML>=6,<7",
]

[project.scripts]
snmp-agent = "snmp_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

